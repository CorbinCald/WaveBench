repos:
  # Keep this rev in lockstep with the ruff version installed in
  # .github/workflows/ci.yml, so CI and the client-side hook agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix]
      - id: ruff-format
        name: ruff-format
