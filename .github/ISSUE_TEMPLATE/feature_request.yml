name: Feature request
description: Suggest a useful change to WaveBench.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change and how you would use it.
    validations:
      required: true
