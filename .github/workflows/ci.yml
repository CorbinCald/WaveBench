name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Pinned so image upgrades are deliberate; ubuntu-latest moves to 26.04 in Oct-Nov 2026.
    runs-on: ubuntu-24.04
    # Jobs take 2-4 minutes; a hung step fails here instead of at GitHub's 6-hour limit.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - name: Prepare tokenizer vocabulary before offline tests
        run: python -c 'import tiktoken; tiktoken.get_encoding("o200k_base")'
      - name: Install sandbox packages
        run: |
          sudo apt-get update
          # Keep apt's needrestart hook from restarting preinstalled services CI never uses;
          # a php8.3-fpm restart stalled this step for 90 s whenever a library it loads upgraded.
          sudo env NEEDRESTART_SUSPEND=1 apt-get install -y --no-install-recommends \
            bubblewrap nodejs apparmor-profiles
      - name: Enable the packaged Bubblewrap AppArmor profile
        run: |
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - run: ruff check .
      - run: ruff format --check .
      - name: Check installed launchers
        run: |
          wavebench --help
          wb --help
          symphony --help
      # "not slow" keeps the live OpenRouter test (real API credits) out of CI.
      - run: python -m pytest -m "not slow"
        env:
          WAVEBENCH_REQUIRE_SANDBOX_TESTS: "1"
