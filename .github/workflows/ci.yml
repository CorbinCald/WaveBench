name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - name: Prepare tokenizer vocabulary before offline tests
        run: python -c 'import tiktoken; tiktoken.get_encoding("o200k_base")'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap nodejs apparmor-profiles
      - name: Enable the packaged Bubblewrap AppArmor profile
        run: |
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - run: ruff check .
      - run: ruff format --check .
      - name: Check installed launchers
        run: |
          wavebench --help
          wb --help
          symphony --help
      # "not slow" keeps the live OpenRouter test (real API credits) out of CI.
      - run: python -m pytest -m "not slow"
        env:
          WAVEBENCH_REQUIRE_SANDBOX_TESTS: "1"
