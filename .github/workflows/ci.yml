name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Pinned so image upgrades are deliberate.
    runs-on: ubuntu-26.04
    # Jobs take about a minute; a hung step, or a hung background apt install, fails here
    # instead of at GitHub's 6-hour limit.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      # Only the tests need the sandbox packages, so apt installs them in the background
      # while Python is set up; "Finish installing sandbox packages" waits for it.
      # Ubuntu 26.04's apparmor package already ships and loads the Bubblewrap profile
      # that the sandbox tests need (see docs/harness.md).
      - name: Start installing sandbox packages
        run: |
          # Skip the image's apt hooks. They refresh AppStream, command-not-found, PackageKit
          # and login-message data that CI never reads, and needrestart's php-fpm restart
          # stalled the apt step for 90 s whenever a library that php-fpm loads was upgraded.
          cat > "$RUNNER_TEMP/apt-no-hooks.conf" <<'EOF'
          #clear APT::Update::Pre-Invoke;
          #clear APT::Update::Post-Invoke-Success;
          #clear DPkg::Post-Invoke;
          EOF
          {
            status=0
            sudo apt-get -c "$RUNNER_TEMP/apt-no-hooks.conf" update &&
              sudo apt-get -c "$RUNNER_TEMP/apt-no-hooks.conf" install -y --no-install-recommends \
                bubblewrap nodejs || status=$?
            echo "Finished after ${SECONDS}s in the background."
            echo "$status" > "$RUNNER_TEMP/sandbox-packages.status"
          } < /dev/null > "$RUNNER_TEMP/sandbox-packages.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A cache restore costs seconds too; the whole download is about 25 MB.
          enable-cache: false
      # --system installs into the setup-python interpreter, as pip did.
      - name: Install Python dependencies
        run: uv pip install --system -e '.[dev]'
      - name: Prepare tokenizer vocabulary before offline tests
        run: python -c 'import tiktoken; tiktoken.get_encoding("o200k_base")'
      - run: ruff check .
      - run: ruff format --check .
      - name: Check installed launchers
        run: |
          wavebench --help
          wb --help
          symphony --help
      - name: Finish installing sandbox packages
        run: |
          until [ -s "$RUNNER_TEMP/sandbox-packages.status" ]; do sleep 0.2; done
          cat "$RUNNER_TEMP/sandbox-packages.log"
          exit "$(cat "$RUNNER_TEMP/sandbox-packages.status")"
      # "not slow" keeps the live OpenRouter test (real API credits) out of CI.
      # -n 4 matches the runner's 4 vCPUs; "-n auto" can count physical cores instead.
      # worksteal hands a worker's queued tests to idle workers, so slow tests don't
      # leave one worker running alone at the end.
      - name: Tests (parallel)
        run: python -m pytest -m "not slow and not serial" -n 4 --dist worksteal --durations=20
        env:
          WAVEBENCH_REQUIRE_SANDBOX_TESTS: "1"
      # Tests that assert on wall-clock time run alone, after the parallel pass.
      - name: Tests (serial)
        run: python -m pytest -m "serial and not slow" --durations=10
        env:
          WAVEBENCH_REQUIRE_SANDBOX_TESTS: "1"
