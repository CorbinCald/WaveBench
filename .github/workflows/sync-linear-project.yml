name: Sync Linear project

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitHub issue URL to assign to the configured Linear project
        required: true
        type: string

permissions:
  contents: read

jobs:
  assign-wavebench-project:
    name: Assign synced Linear issue to the configured project
    if: vars.LINEAR_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LINEAR_TEAM_KEY: ${{ secrets.LINEAR_TEAM_KEY }}
      LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Assign Linear project
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          EVENT_ISSUE_URL: ${{ github.event.issue.html_url }}
          INPUT_ISSUE_URL: ${{ inputs.issue_url }}
        run: |
          issue_url="${EVENT_ISSUE_URL:-$INPUT_ISSUE_URL}"
          python .github/scripts/sync_linear_issue_project.py \
            --issue-url "$issue_url" \
            --team-key "$LINEAR_TEAM_KEY" \
            --project-id "$LINEAR_PROJECT_ID"
